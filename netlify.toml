[build]
  publish = "site"
  functions = "netlify/functions"
  # No build step: site/data and the function data are produced by the scheduled pipeline and committed.
  command = "test -f netlify/edge-functions/site-hits.js || { echo 'netlify/edge-functions/site-hits.js missing (Shifted Labs traffic counter)'; exit 1; }"   # static site; this only refuses to deploy without the traffic counter

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/data/**"]

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"   # short: after a release the scripts update at once, the data within 5 minutes

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---- Pages: routes for each area are in site/_redirects.
