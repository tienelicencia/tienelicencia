[build]
  publish = "site"
  functions = "netlify/functions"
  # No build step: site/data and the function data are produced by the scheduled pipeline and committed.
  command = "echo 'static site — data built by .github/workflows/refresh.yml'"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/data/**"]

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---- Pages. One block per area slug (keep in step with AREAS in pipeline/site_build.py).
[[redirects]]
