name: Refresh data

# Daily: refresh the sources (Junta register only re-downloads when it changed; new Inside Airbnb snapshots; Catastro;
# INE), re-check the least-recently-checked Airbnb listings of each city in parallel jobs (separate runners, so each city
# has its own pace and IP), then rebuild the site data and commit. Per-listing results go to a private state repository
# (checked out at ./state with a deploy key); only aggregate data is committed here. Netlify redeploys automatically on the commit.
on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      budget:
        description: "Listings to re-check per city this run (0 = just rebuild)"
        default: "150"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # the first run in a new repository downloads everything (Catastro: ~100 municipalities)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Restore data cache (register, snapshots, barrios, Catastro, INE)
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}
          restore-keys: rta-cache-
      - name: Refresh sources
        working-directory: pipeline
        continue-on-error: true   # a source being down shouldn't stop the run: build from the cached copies
        run: python site_build.py refresh
      - name: Check we have a register
        run: |
          if [ ! -f pipeline/cache/register/register_meta.json ]; then
            echo "::error::No Junta register downloaded or cached: see 'Refresh sources' above."
            exit 1
          fi
          du -sh pipeline/cache/* || true
      # Save only a complete cache, so a failed download never replaces a good copy
      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}

  recheck:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        city: [malaga, sevilla, barcelona, madrid, mallorca, valencia, bilbao, donostia]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Private state (per-listing checks, hand-collected notes)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO || 'tienelicencia/tienelicencia-state' }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}
          restore-keys: rta-cache-
      - name: Re-check listings on Airbnb (rolling)
        working-directory: pipeline
        continue-on-error: true   # if Airbnb blocks, keep what was checked
        timeout-minutes: 285
        # ~9–10 s per listing: stop cleanly at 270 min and keep what was checked
        # Daily: a rolling random sample of 150 per city (~25 min) keeps the headline current at low cost; a manual run can do more.
        run: python site_build.py recheck --city ${{ matrix.city }} --budget ${{ github.event.inputs.budget || '150' }} --max-minutes 270
      # Save the checks straight away (each city has its own state file, so the two jobs never clash).
      - name: Save check progress
        if: always()
        working-directory: state
        run: |
          git config user.name "licencemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Listing checks ${{ matrix.city }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 20 + 10))
          done
          exit 1

  build:
    needs: recheck
    if: always()   # rebuild even if a city's checks failed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch head
      - name: Private state (per-listing checks, hand-collected notes)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO || 'tienelicencia/tienelicencia-state' }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}
          restore-keys: rta-cache-
      - name: Build site data
        working-directory: pipeline
        run: |
          if [ ! -f cache/register/register_meta.json ]; then
            echo "::error::No register in the cache: the 'sources' job didn't finish (see its log). Run the workflow again."
            exit 1
          fi
          python site_build.py build
      - name: Tests
        run: |
          cd pipeline && python -m unittest discover -s tests && cd ..
          node netlify/functions/test.mjs
      - name: Commit
        run: |
          git config user.name "licencemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data netlify/functions/data   # aggregate data only; per-listing state lives in the private repo
          git diff --cached --quiet && exit 0
          git commit -m "Data refresh $(date -u +%F)"
          # Code may have been pushed meanwhile: replay the data commit on top. On a clash in a data file, this run's
          # freshly built copy wins.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
