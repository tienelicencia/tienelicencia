name: 2 · Airbnb checks

# Our own data: reads Airbnb listing pages, politely (one at a time, 6–12 s apart, no login), and saves the per-listing
# results to the private state repository (checked out at ./state with a deploy key). Never commits here.
#   recheck: a rolling sample of each Inside Airbnb city's listings, every day after "1 · Sources" (separate runners, so
#            each city has its own pace).
#   sample:  for towns without Inside Airbnb data, rebuild the list of their listings and check a fixed random sample
#            (quarterly, or on demand).
# "3 · Build site" runs when this finishes.
on:
  workflow_run:
    workflows: ["1 · Sources"]
    types: [completed]
  schedule:
    - cron: "40 4 1 */3 *"   # quarterly town samples: 1st of Jan/Apr/Jul/Oct 04:40 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: "Listings to re-check per city (0 = skip re-checks)"
        default: "150"
      samples:
        description: "Also run the town samples (true/false)"
        default: "false"
      towns:
        description: "Towns to sample (JSON list)"
        default: '["marbella", "granada", "cordoba", "cadiz", "zaragoza", "murcia", "laspalmas"]'
      n:
        description: "Sample size per town"
        default: "1000"
      refresh_frame:
        description: "Rebuild the list of a town's listings even if recent (true/false)"
        default: "false"

permissions:
  contents: read

concurrency:
  group: checks
  cancel-in-progress: false

jobs:
  recheck:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.budget != '0' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        city: [malaga, sevilla, barcelona, madrid, mallorca, valencia, bilbao, donostia]
    steps:
      - uses: actions/checkout@v4
      - name: Private state (per-listing checks)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO || 'tienelicencia/tienelicencia-state' }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}
          restore-keys: rta-cache-
      - name: Re-check listings on Airbnb (rolling)
        working-directory: pipeline
        continue-on-error: true   # if Airbnb blocks, keep what was checked
        timeout-minutes: 285
        run: python site_build.py recheck --city ${{ matrix.city }} --budget ${{ github.event.inputs.budget || '150' }} --max-minutes 270
      - name: Save check progress
        if: always()
        working-directory: state
        run: |
          git config user.name "licencemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Listing checks ${{ matrix.city }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 20 + 10))
          done
          exit 1

  sample:
    if: github.event_name == 'schedule' || github.event.inputs.samples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        town: ${{ fromJSON(github.event.inputs.towns || '["marbella", "granada", "cordoba", "cadiz", "zaragoza", "murcia", "laspalmas"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Private state (town samples)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO || 'tienelicencia/tienelicencia-state' }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}
          restore-keys: rta-cache-
      - name: List and check the sample
        working-directory: pipeline
        continue-on-error: true   # keep what was checked if Airbnb blocks or time runs out
        timeout-minutes: 335
        run: >
          python site_build.py sample --town ${{ matrix.town }} --n ${{ github.event.inputs.n || '1000' }}
          --max-minutes 320 ${{ github.event.inputs.refresh_frame == 'true' && '--refresh-frame' || '' }}
      - name: Save
        if: always()
        working-directory: state
        run: |
          git config user.name "licencemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add samples
          git diff --cached --quiet && exit 0
          git commit -m "Town sample ${{ matrix.town }} $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 20 + 10))
          done
          exit 1
