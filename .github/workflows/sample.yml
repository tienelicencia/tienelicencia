name: Town samples

# For towns without Inside Airbnb data: build the list of the town's Airbnb listings from Airbnb's search pages (about once a
# quarter), live-check a fixed random sample of them, and commit the results (state/samples/<town>.json). The daily
# "Refresh data" run turns them into each town's estimate. One job per town, in parallel; a run that hits the time limit
# saves its progress and the next run continues. Results go to the private state repository (./state).
on:
  schedule:
    - cron: "40 4 1 */3 *"   # quarterly, 1st of Jan/Apr/Jul/Oct 04:40 UTC
  workflow_dispatch:
    inputs:
      towns:
        description: "Towns (JSON list)"
        default: '["marbella", "granada", "cordoba", "cadiz", "zaragoza", "murcia", "laspalmas"]'
      n:
        description: "Sample size per town"
        default: "1000"
      refresh_frame:
        description: "Rebuild the list of listings even if recent (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: samples
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        town: ${{ fromJSON(github.event.inputs.towns || '["marbella", "granada", "cordoba", "cadiz", "zaragoza", "murcia", "laspalmas"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Private state (per-listing checks, hand-collected notes)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STATE_REPO || 'tienelicencia/tienelicencia-state' }}
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl
      - name: Restore data cache (register)
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: rta-cache-${{ github.run_id }}
          restore-keys: rta-cache-
      - name: Register (if the cache has none)
        working-directory: pipeline
        run: test -f cache/register/openrta_all.json || python site_build.py refresh
      - name: List and check the sample
        working-directory: pipeline
        continue-on-error: true   # keep what was checked if Airbnb blocks or time runs out
        timeout-minutes: 335
        run: >
          python site_build.py sample --town ${{ matrix.town }} --n ${{ github.event.inputs.n || '1000' }}
          --max-minutes 320 ${{ github.event.inputs.refresh_frame == 'true' && '--refresh-frame' || '' }}
      - name: Save
        if: always()
        working-directory: state
        run: |
          git config user.name "licencemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add samples
          git diff --cached --quiet && exit 0
          git commit -m "Town sample ${{ matrix.town }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((RANDOM % 20 + 10))
          done
          exit 1
