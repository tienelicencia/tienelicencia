<body class="map-page">
<header class="mapbar">
  <a class="back" id="back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="summary"></span></a>
  <span class="sep"></span>
  <a class="brand-link" href="/" aria-label="tienelicencia.com"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0d5a46"/><path d="M8.5 19.2 20 9.6l11.5 9.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.4 17v11.6c0 1 .8 1.8 1.8 1.8h11.6c1 0 1.8-.8 1.8-1.8V17" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m15.6 23.4 3.1 3.1 5.8-6" fill="none" stroke="#e2b54a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <div class="title" id="map-title">&nbsp;<small>tienelicencia.com</small></div>
  <span class="spacer"></span>
  <span id="map-share"></span>
  <a id="map-report" class="share-btn" href="/contacto?tipo=correccion" data-t-aria="map_report"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span data-t="map_report"></span></a>
  <select id="area-switch" aria-label="Zona / Area"></select>
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-l="es" aria-pressed="false">ES</button>
    <button type="button" data-l="en" aria-pressed="false">EN</button>
  </div>
</header>

<div id="map" role="region" aria-label="Mapa"></div>
<div id="map-loading" role="status" data-t="loading"></div>

<aside id="side">
  <nav id="layers" aria-label="Capas"></nav>
  <div id="legend"></div>
  <button class="search-fab" type="button" id="search-fab" data-t-aria="search_btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <div id="sheet" data-mode="search" aria-live="polite">
    <div class="sheet-head"><span class="grip"></span><button class="x" type="button" id="sheet-close" aria-label="Cerrar / Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sheet-body">
      <section id="p-search"></section>
      <section id="p-detail"></section>
    </div>
  </div>
</aside>
<script src="/assets/js/map.js"></script>
</body>
</html>
